project_id = "jove-english-os"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173/jove-english-os/"
additional_redirect_urls = ["http://127.0.0.1:4173/jove-english-os/", "https://mnijc19-netizen.github.io/jove-english-os/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
# Enable email as a sign-in provider; top-level enable_signup=false still forbids registration.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Jove English sign-in code"
content_path = "./supabase/templates/otp.html"

[analytics]
enabled = false

[functions.ai]
# Auth.getUser(jwt) + app_members is enforced inside every handler. Supabase's
# legacy gateway JWT check is incompatible with newer project signing keys.
verify_jwt = false
entrypoint = "./functions/ai/index.ts"

[functions.speech-assess]
verify_jwt = false
entrypoint = "./functions/speech-assess/index.ts"

[functions.content]
verify_jwt = false
entrypoint = "./functions/content/index.ts"
